<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Termstack</title>
<meta name="description" content="Termstack manages the non-legal side of a law firm: finance, people, technology, marketing, intake, and operations." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#FFFFFF;
    --ink:#16181C;
    --muted:#6A6F76;
    --line:#E4E3DE;
    --accent:#2B4ED6;
    --red:#D02B2B;
    --display:"Schibsted Grotesk",system-ui,sans-serif;
    --body:"Schibsted Grotesk",system-ui,sans-serif;
    --mono:"Schibsted Grotesk",system-ui,sans-serif;
    --gutter:clamp(20px,5vw,72px);
  }

  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--paper);color:var(--ink);
    font-family:var(--body);font-size:17px;line-height:1.55;
    display:flex;flex-direction:column;min-height:100vh;
    -webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility;
  }
  a{color:inherit;text-decoration:none;}
  ::selection{background:var(--ink);color:#fff;}

  .mark{
    font-family:var(--display);font-weight:700;
    line-height:0.88;letter-spacing:-0.045em;margin:0;
  }
  .label{
    font-family:var(--mono);font-size:17px;font-weight:500;
    letter-spacing:0;color:var(--muted);
  }

  .top{
    display:flex;align-items:flex-start;justify-content:space-between;
    gap:24px;padding:clamp(28px,4vw,48px) var(--gutter) 0;
  }
  .nav{display:flex;gap:clamp(18px,2.6vw,34px);flex-wrap:wrap;justify-content:flex-end;padding-top:6px;}
  .nav a{font-weight:500;letter-spacing:-0.015em;color:var(--muted);white-space:nowrap;transition:color .2s;}
  .nav a:hover{color:var(--accent);}
  .nav a.nav-book{color:var(--ink);border-bottom:2px solid var(--ink);padding-bottom:2px;}
  .nav a.nav-book:hover{color:var(--accent);border-bottom-color:var(--accent);}
  .wordmark{font-size:clamp(2.4rem,7.5vw,6rem);}
  .dot{color:var(--red);}
  .red{color:var(--red);}
  main{flex:1;display:flex;align-items:center;padding:clamp(48px,8vw,96px) var(--gutter);}
  .enter{
    display:inline-block;margin-top:clamp(30px,4vw,46px);
    font-family:var(--display);font-weight:500;font-size:17px;
    border-bottom:2px solid var(--ink);padding-bottom:3px;
    transition:color .2s,border-color .2s;
  }
  .enter:hover{color:var(--accent);border-color:var(--accent);}
  .inner{width:100%;}

  h1.mark{font-size:clamp(2.4rem,7.5vw,6rem);max-width:15ch;text-transform:uppercase;}

  footer{padding:0 var(--gutter);}
  .foot-bar{
    border-top:1px solid var(--line);padding:18px 0;
    display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;
    font-family:var(--mono);font-size:17px;color:var(--muted);
  }
  .foot-bar a{border-bottom:1px solid var(--line);padding-bottom:2px;transition:color .2s,border-color .2s;}
  .foot-bar a:hover{color:var(--ink);border-color:var(--ink);}

  @media(max-width:760px){
    h1.mark{max-width:none;}
  }
  a:focus-visible{outline:2px solid var(--accent);outline-offset:3px;}
  @media(prefers-reduced-motion:reduce){
    *{transition:none!important;}
  }
</style>
</head>
<body id="top">

<header class="top">
  <a href="#top" class="mark wordmark">TERM<br>STACK<span class="dot">.</span></a>
  <nav class="nav">
    <a href="about.html">About us</a>
    <a href="pilot.html">Pilot</a>
    <a class="nav-book" href="https://calendly.com/marissa-termstack/30min" target="_blank">Book a call</a>
  </nav>
</header>

<main>
  <div class="inner">
    <h1 class="mark">Home of the Dream <span class="red">Seekers</span> &amp; Hill <span class="red">Climbers</span>.</h1>
    <a class="enter" href="mso.html">The MSO platform &rarr;</a>
  </div>
</main>



<footer>
  <div class="foot-bar">
    <span>&copy; 2026 Termstack. All rights reserved.</span>
    <a href="disclaimers.html">Disclaimers &amp; Notices</a>
  </div>
</footer>

</body>
</html>
